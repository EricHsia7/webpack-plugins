name: Publish Package

on:
  push:
    tags:
      - 'v*' # Triggers the workflow on version tag pushes (e.g., v1.0.0)

permissions:
  id-token: write  # Crucial: Required for exchanging OIDC tokens with npm
  contents: read   # Required to checkout the repository

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24' # OIDC requires Node >= 22.14.0
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run build (if present)
        run: npm run build --if-present

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish # The npm CLI automatically detects OIDC and authenticates